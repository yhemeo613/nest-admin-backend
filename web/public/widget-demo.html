<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页挂件演示（模拟任意第三方网站）</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f5f6f8;
        color: #1f2329;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 1.8;
        color: #4e5969;
      }
      code {
        background: #eef0f3;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 13px;
      }
      .tip {
        background: #fff;
        border: 1px solid #e5e6eb;
        border-radius: 10px;
        padding: 16px 20px;
        margin-top: 24px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>这是一个模拟的第三方网站</h1>
      <p> 本页面等价于任意一家企业自己的官网。右下角的「在线客服」气泡由一行脚本注入： </p>
      <p
        ><code
          >&lt;script src="http://localhost:3000/widget.js?k=演示Key"&gt;&lt;/script&gt;</code
        ></p
      >
      <div class="tip">
        试试点击右下角气泡提问，例如：<b>「退货运费由谁承担？」</b>
        ——回答由 AI 基于该租户知识库生成，下方还会推荐相关帮助文章（点开即帮助中心 SEO 页）。
      </div>
    </div>

    <!-- 网页挂件：生产环境替换为你在「租户管理 → API Key」复制的代码 -->
    <script src="http://localhost:3000/widget.js?k=sk-local-demo-001"></script>
  </body>
</html>
